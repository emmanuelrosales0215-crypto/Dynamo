name: redline tests

on:
  push:
    paths: ["redline/**", "pyproject.toml", ".github/workflows/redline-tests.yml"]
  pull_request:
    paths: ["redline/**", "pyproject.toml", ".github/workflows/redline-tests.yml"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
